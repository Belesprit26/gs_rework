name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately. An unpinned `channel: stable` follows whatever
      # Flutter ships, so CI silently drifted to 3.47.0 while releases are
      # built on 3.38.9 — and 3.47 raised the minimum Gradle to 8.14.0, which
      # this project's wrapper (8.10.2) does not meet. A green tick has to
      # mean "the toolchain we actually ship with is healthy". Bump this in
      # lockstep with the local SDK, alongside the Gradle/AGP upgrade.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (fail on warnings)
        run: flutter analyze

      - name: Test
        run: flutter test

      # Debug build validates the full Gradle config (Crashlytics plugin,
      # google-services, desugaring) without needing the signing key.
      # Release signing is deliberately absent in CI — the build fails
      # fast if a release is attempted without key.properties.
      - name: Android debug build
        run: flutter build apk --debug

      - name: Version bumped on main
        if: github.ref == 'refs/heads/main'
        run: |
          grep -E '^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' pubspec.yaml \
            || (echo "pubspec version malformed" && exit 1)
